@let active = selected();
<div class="category-filter" role="radiogroup" [attr.aria-label]="'CATALOG.FILTER_LABEL' | mTranslate">
  <button
    type="button"
    class="category-filter__item"
    role="radio"
    [class.category-filter__item--active]="active === undefined"
    [attr.aria-checked]="active === undefined"
    (click)="onSelect(undefined)">
    {{ 'CATALOG.FILTER_ALL' | mTranslate }}
  </button>
  @for (cat of categories; track cat) {
    <button
      type="button"
      class="category-filter__item"
      role="radio"
      [class.category-filter__item--active]="active === cat"
      [attr.aria-checked]="active === cat"
      (click)="onSelect(cat)">
      {{ i18nKeys[cat] | mTranslate }}
    </button>
  }
</div>
